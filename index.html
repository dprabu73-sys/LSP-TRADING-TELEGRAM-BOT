<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LSP Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LSP Trading Telegram Bot – Learn by Playing</title>
<meta name="description" content="A guided, animated practice simulator of the LSP Trading Telegram Bot. English and Tamil. No real money, no login.">
<meta name="theme-color" content="#0F172A">
<style>
:root{--blue:#0284C7;--blue-d:#1D4ED8;--green:#059669;--red:#DC2626;--amber:#F59E0B;--ink:#0F172A;--ink2:#334155;--mute:#64748B;--line:#E2E8F0;--bg:#EAF1FA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Noto Sans Tamil","Nirmala UI","Latha",Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
code{background:rgba(15,23,42,.08);padding:1px 6px;border-radius:5px;font-size:.92em}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:40}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-d));display:grid;place-items:center;color:#fff}
.seg{display:flex;background:#EEF2F7;border-radius:12px;padding:3px;margin:0 auto;min-width:0}
.seg button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected=true]{background:#fff;color:var(--blue-d);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0F172A;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;font-size:20px;background:#EEF2F7;display:grid;place-items:center;flex:none}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:3px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .5s}

/* ---------- stage ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;gap:36px;padding:16px}
.side{width:390px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px}
.phoneWrap{height:100%;display:grid;place-items:center;min-width:0}
.phone{height:min(100%,820px);width:min(400px,calc((100dvh - 96px)*.49));min-width:340px;background:#0B1220;border-radius:46px;padding:11px;box-shadow:0 30px 60px -20px rgba(2,6,23,.55),inset 0 0 0 2px #334155}
.screen{height:100%;background:#fff;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 4px;font-size:12px;font-weight:700;background:#517DA2;color:#fff}
.sbar .notch{width:84px;height:18px;background:#0B1220;border-radius:12px;margin-top:-4px}
.tghead{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;background:#517DA2;color:#fff}
.tghead .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#38BDF8,#2563EB);display:grid;place-items:center;font-size:20px}
.tghead b{display:block;font-size:15px;line-height:1.2}
.tghead small{font-size:12px;opacity:.85}
.tghead .tag{font-size:10px;background:#93C5FD;color:#1E3A8A;border-radius:4px;padding:1px 4px;vertical-align:middle}
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;background:#9DB9D1 radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 40px,transparent 41px) 0 0/90px 90px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{display:flex;flex-direction:column;max-width:94%;animation:pop .25s ease-out}
.msg.bot{align-self:flex-start}.msg.me{align-self:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.bubble{background:#fff;border-radius:14px 14px 14px 4px;padding:9px 11px 6px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.12);color:#0F172A}
.msg.me .bubble{background:#EFFDDE;border-radius:14px 14px 4px 14px;font-weight:600}
.bubble .ct{font-weight:800;padding-bottom:5px;margin-bottom:5px;border-bottom:1px dashed #CBD5E1}
.bubble .r{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin:3px 0}
.bubble .r span{color:#475569}.bubble .r b{text-align:right}
.bubble .ft{font-size:12px;color:#475569;margin-top:6px;padding-top:5px;border-top:1px dashed #E2E8F0}
.bubble .item{display:flex;gap:6px;font-size:12.5px;margin:3px 0}
.bubble .item code{font-weight:700;color:#1D4ED8;white-space:nowrap;background:none;padding:0}
.bubble pre{font-size:11px;line-height:1.45;background:#0F172A;color:#A7F3D0;padding:8px;border-radius:8px;overflow-x:auto;margin:4px 0}
.bubble.warn{border-left:4px solid var(--amber);background:#FFFBEB}
.bubble.danger{border-left:4px solid var(--red);background:#FEF2F2}
.bubble.ok{border-left:4px solid var(--green)}
.time{display:block;text-align:right;font-size:10.5px;color:#94A3B8;margin-top:2px}
.g{color:var(--green)}.rd{color:var(--red)}.bl{color:var(--blue-d)}
.inline{display:grid;gap:3px;margin-top:3px}
.inline .row{display:flex;gap:3px}
.inline button{flex:1;background:rgba(40,60,90,.62);color:#fff;font-size:13px;font-weight:600;padding:10px 6px;border-radius:9px;min-height:42px;backdrop-filter:blur(3px);text-align:center}
.inline button:hover:not(:disabled){background:rgba(40,60,90,.82)}
.inline button.go{background:rgba(5,150,105,.92)}.inline button.stop{background:rgba(220,38,38,.92)}
.inline button:disabled{opacity:.5;cursor:default}
.inline button:disabled.go,.inline button:disabled.stop{opacity:1}
.typing .bubble{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#94A3B8;animation:bn 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.dock{position:relative;z-index:30;background:#E8EDF2;padding:8px;max-height:46%;overflow-y:auto}
.dock:empty{display:none}
.composer{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;border:0;background:#F1F5F9;border-radius:18px;padding:9px 13px;font-size:16px;min-width:0}
.composer button{width:36px;height:36px;border-radius:50%;font-size:16px;color:#517DA2}
.composer button.send{background:#517DA2;color:#fff}
.app.guided .composer{display:none}
.kb{background:#E8EDF2;padding:7px;padding-bottom:max(7px,env(safe-area-inset-bottom));display:grid;gap:5px;max-height:262px;overflow-y:auto}
.kb .kr{display:grid;gap:5px}
.kb button{background:#fff;border-radius:8px;padding:10px 4px;min-height:42px;font-size:13px;font-weight:600;color:#1E293B;box-shadow:0 1px 0 rgba(0,0,0,.18);transition:transform .08s}
.kb button:active{transform:scale(.95);background:#DBEAFE}
.kb .pill{font-size:12px;padding:8px 2px}.kb .back{background:#DBEAFE;color:#1E40AF}.kb .kill{background:#FEE2E2;color:#B91C1C}
.kb.hidden{display:none}

/* spotlight */
.spot{position:absolute;z-index:20;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px var(--amber),0 0 0 2000px rgba(8,15,30,.58);animation:ring 1.4s ease-in-out infinite;display:none;transition:left .25s,top .25s,width .25s,height .25s}
@keyframes ring{0%,100%{box-shadow:0 0 0 3px var(--amber),0 0 0 2000px rgba(8,15,30,.58)}50%{box-shadow:0 0 0 8px rgba(245,158,11,.55),0 0 0 2000px rgba(8,15,30,.58)}}
.finger{position:absolute;z-index:21;pointer-events:none;font-size:30px;display:none;animation:tap 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-10px)}}

/* coach */
.coach{display:flex;gap:10px;background:linear-gradient(135deg,#0F172A,#1E3A8A);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);position:relative}
.coach.enter{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.coach.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cav{font-size:30px;animation:bob 2.2s ease-in-out infinite;align-self:flex-start}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cbody{flex:1;min-width:0}
.ctag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#93C5FD}
.ctitle{display:block;font-size:16px;margin:2px 0;padding-right:26px}
.ctext{font-size:14px;line-height:1.5;color:#E2E8F0}
.cextra{margin-top:8px;font-size:13px;color:#BFDBFE}
.cextra:empty{display:none}
.cacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cacts:empty{display:none}
.cbtn{background:var(--amber);color:#1F2937;font-weight:800;padding:10px 16px;border-radius:10px;min-height:42px}
.cbtn.alt{background:rgba(255,255,255,.15);color:#fff}
.cmin{position:absolute;right:8px;top:6px;width:30px;height:30px;color:#93C5FD;font-size:16px;display:none}
.coach.min .ctext,.coach.min .cacts,.coach.min .cextra{display:none}
.coach.min .cmin{transform:rotate(180deg)}
.chap{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px -10px rgba(15,23,42,.35)}
.chap h4{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.chap li{list-style:none;display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;color:var(--mute)}
.chap li i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid #CBD5E1;display:grid;place-items:center;font-size:12px;flex:none}
.chap li.now{color:var(--ink);font-weight:700}.chap li.now i{border-color:var(--blue);background:#DBEAFE}
.chap li.done{color:var(--ink2)}.chap li.done i{background:var(--green);border-color:var(--green);color:#fff}

/* in-chat widgets */
.spark{width:100%;height:auto;margin:4px 0}
.spark .pl{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark text{font-size:9px;font-weight:700}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.tg{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#E0F2FE;color:#075985;animation:pop .3s both}
.tg.gr{background:#D1FAE5;color:#065F46}.tg.rr{background:#FEE2E2;color:#991B1B}
.stw .strow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.stw .strow b{font-size:17px}
.stbar{position:relative;height:74px;margin:2px 10px 0}
.sttrack{position:absolute;left:0;right:0;top:34px;height:8px;background:#E2E8F0;border-radius:4px}
.stfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#34D399,#059669);border-radius:4px}
.sttk{position:absolute;top:46px;font-size:10px;font-weight:700;color:var(--mute);transform:translateX(-50%)}
.sttk.m{color:var(--blue-d)}
.stdot{position:absolute;top:10px;font-size:22px;transform:translateX(-50%);transition:left .1s}
.stnet{position:absolute;top:56px;transform:translateX(-50%);font-size:18px;transition:left .45s cubic-bezier(.3,1.5,.5,1)}
.strange{width:100%;height:34px;accent-color:var(--blue-d);margin-top:2px}
.stpips{display:flex;gap:4px;margin:4px 0}
.stpips span{flex:1;text-align:center;font-size:11px;font-weight:700;border:2px dashed #CBD5E1;border-radius:8px;padding:3px 0;color:var(--mute);transition:all .3s}
.stpips span.on{border:2px solid var(--green);background:#ECFDF5;color:var(--green);transform:translateY(-2px)}
.stmsg{font-size:12.5px;margin:6px 0;padding:8px 10px;border-radius:10px;background:#F1F5F9}
.stmsg.up{background:#ECFDF5}.stmsg.bad{background:#FEF2F2}
.stfall{width:100%;margin-top:2px;background:#EFF6FF;color:#1E40AF;font-weight:700;border-radius:9px;padding:10px;min-height:42px}
.bigms{font-size:34px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--red)}
.wallet{background:linear-gradient(135deg,#0F172A,#1E3A8A);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.wallet small{opacity:.75;font-size:11px}.wallet b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.hidrow{opacity:0;transform:translateX(-8px);transition:all .4s}.hidrow.show{opacity:1;transform:none}
.split{height:12px;border-radius:99px;overflow:hidden;display:flex;margin:8px 0 4px;background:#E2E8F0}
.split i{display:block;width:0;transition:width .8s}
.bc{width:100%;height:auto;border-radius:10px;margin:6px 0;display:block}
.nameIn{width:100%;padding:9px 11px;border:2px solid var(--line);border-radius:10px;font-size:16px;margin:4px 0}

/* overlays */
.toast{position:fixed;left:50%;bottom:max(24px,calc(12px + env(safe-area-inset-bottom)));transform:translateX(-50%);background:#0F172A;color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:300;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.ov.open{display:flex}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:rise .25s;max-height:88dvh;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:10px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;flex-wrap:wrap}
.mrow .opts{display:flex;gap:6px}
.mrow .opts button,.mbtn{padding:9px 13px;border-radius:10px;background:#EEF2F7;font-weight:700;font-size:14px;min-height:40px}
.mrow .opts button.on{background:var(--blue-d);color:#fff}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;text-decoration:none;color:inherit;justify-content:flex-start;font-size:15px}
.mbtn.primary{background:var(--blue-d);color:#fff}
.mnote{font-size:12.5px;color:var(--mute);margin-top:12px}
.conf{position:fixed;top:-40px;font-size:26px;z-index:200;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* ---------- mobile: the phone IS the screen ---------- */
@media (max-width:820px){
  .stage{padding:0;gap:0;display:block}
  .side{display:none}
  .phoneWrap{display:block}
  .phone{width:100%;height:100%;min-width:0;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{border-radius:0}
  .sbar{display:none}
  .logo{display:none}
  .seg{flex:1}
  .seg button{flex:1;padding:8px 6px;font-size:13px}
  .cmin{display:block}
  .dock .coach{box-shadow:none}
}
@media (max-width:420px){.chip .ce{display:none}.chip{padding:7px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app guided" id="app">
  <header class="bar">
    <div class="logo"><i>🛡️</i><b>LSP Academy</b></div>
    <div class="seg" role="tablist">
      <button id="tabGuide" role="tab" aria-selected="true" data-t="guided"></button>
      <button id="tabFree" role="tab" aria-selected="false" data-t="free"></button>
    </div>
    <span class="chip" aria-label="Simulated time"><span class="ce">🕘</span><span id="clockT">09:00</span></span>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
  </header>

  <main class="stage">
    <aside class="side" id="side">
      <div id="coachHome"></div>
      <div class="chap" id="chap"></div>
    </aside>
    <div class="phoneWrap">
      <div class="phone">
        <div class="screen" id="screen">
          <div class="sbar"><span>9:41</span><span class="notch"></span><span>5G ▂▄▆ 🔋</span></div>
          <div class="tghead"><span aria-hidden="true">‹</span><div class="av">🤖</div><div><b>LSP Trading Bot <span class="tag">BOT</span></b><small id="tgsub">bot</small></div></div>
          <div class="chat" id="chat" role="log" aria-live="polite"></div>
          <div class="dock" id="dock"></div>
          <form class="composer" id="composer" autocomplete="off">
            <button type="button" id="kbToggle" aria-label="Show or hide keyboard">⌨️</button>
            <input id="msg" placeholder="Message (try /kill)" aria-label="Type a command" maxlength="60">
            <button class="send" type="submit" aria-label="Send">➤</button>
          </form>
          <div class="kb" id="kb"></div>
          <div class="spot" id="spot"></div>
          <div class="finger" id="finger" aria-hidden="true">👆</div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let lang=store.get('lsp2_lang',(navigator.language||'').startsWith('ta')?'ta':'en');
let soundOn=store.get('lsp2_sound',true), speed=store.get('lsp2_speed','normal');
const SPEED={slow:1.7,normal:1,fast:.3};
const L=(en,ta)=>lang==='ta'&&ta?ta:en;
const LP=p=>L(p[0],p[1]);
const sleep=ms=>new Promise(r=>setTimeout(r,reduced?0:ms*SPEED[speed]));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let tt;const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2300)};

/* ================= sound ================= */
let ac=null;
function tone(f,t0,d,type='sine',v=.08){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function sfx(n){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const S={tap:()=>tone(520,0,.06,'triangle'),send:()=>tone(660,0,.07,'triangle'),recv:()=>{tone(880,0,.09);tone(1175,.08,.12)},

    const f=$('.stfill',w);f.style.left=stPct(0);f.style.width=(Math.max(price,0)/(ST_HIGH-ST_LOW)*100)+'%';
    $('.stdot',w).style.left=stPct(price);$('.stnet',w).style.left=stPct(fl);
    $('.sp',w).textContent=sgn(price);const sn=$('.sn',w);sn.textContent=sgn(fl);sn.className='sn '+(fl>0?'g':'rd');
    $$('.stpips span',w).forEach((s,i)=>s.classList.toggle('on',peak>=STEPS_R[i][0]));
    let cls='',t;
    if(fell){cls=fl>0?'up':'bad';t=fl>0?L(`📉 Price turned around and hit the net. Sold at +${fl} pts → you keep ${mny(fl)}. A winner never became a loss!`,`📉 விலை திரும்பி வலையைத் தொட்டது. +${fl} pts-ல் விற்றது → ${mny(fl)} உங்களுக்கு. வெற்றி நஷ்டமாக மாறவில்லை!`):L(`📉 Price fell to the net. Sold at −${-fl} pts (${mny(fl)}). That's the most this trade could ever cost.`,`📉 விலை வலைக்கு வந்தது. −${-fl} pts-ல் விற்றது (${mny(fl)}). இந்த வர்த்தகத்தின் அதிகபட்ச இழப்பு இதுவே.`)}
    else if(peak<25)t=L(`Net starts at −25 pts: the most you can lose is ${mny(INIT).replace('−','')}. Drag the 📈 right!`,`வலை −25 pts-ல் தொடங்கும்: அதிகபட்ச இழப்பு ${mny(INIT).replace('−','')}. 📈-ஐ வலப்புறம் இழுங்கள்!`);
    else{cls='up';const k=STEPS_R.filter(x=>peak>=x[0]).length;t=L(`<b>Step ${k} unlocked! 🎉</b> Net jumped to +${fl} pts — you keep at least ${mny(fl)}.`,`<b>படி ${k} திறந்தது! 🎉</b> வலை +${fl} pts-க்கு உயர்ந்தது — குறைந்தது ${mny(fl)} உங்களுக்கு.`)+(price<peak?L(' <i>(You dragged back, but the net stayed.)</i>',' <i>(பின்னால் இழுத்தாலும் வலை இறங்கவில்லை.)</i>'):'')}
    msg.className='stmsg '+cls;msg.innerHTML=t};
  const fire=()=>{for(const [t] of STEPS_R)if(peak>=t&&!seen.has(t)){seen.add(t);sfx('ok');onAction('stairs:'+t)}};
  slider.addEventListener('input',()=>{price=+slider.value;fell=false;peak=Math.max(peak,price);render();fire()});
  $('.stfall',w).addEventListener('click',()=>{fell=true;price=floorFor(peak);slider.value=Math.max(0,price);render();sfx(floorFor(peak)>0?'ok':'warn');onAction('stairs:fall')});
  render();
}

function tokenOf(text){const t=text.trim();if(roomByLabel[t])return 'room:'+roomByLabel[t];if(t==='🔙 Back to Main')return 'back';if(t==='⌨️ Hide Menu')return 'hide';
  const mm=t.replace(/^[^\w/]+\s*/,'').match(/^\/([a-z_]+)(?:@\w+)?\s*(.*)$/i);return mm?'/'+mm[1].toLowerCase()+(mm[2].trim()?' '+mm[2].trim().toLowerCase():''):'text'}
async function route(text){
  const t=text.trim();
  if(roomByLabel[t])return openRoom(roomByLabel[t]);
  if(t==='🔙 Back to Main'){kbState='main';renderKb();return botSay({h:C(L('🏠 MAIN MENU','🏠 முதன்மை மெனு'),[],L('Pick a room with the buttons below.','கீழுள்ள பொத்தான்களால் ஒரு அறையைத் தேர்ந்தெடுங்கள்.'))},350)}
  if(t==='⌨️ Hide Menu'){kbHidden=true;renderKb();return botSay({h:C(L('⌨️ Keyboard hidden','⌨️ விசைப்பலகை மறைந்தது'),[],L('Type <b>/menu</b> to bring it back.','திரும்பப் பெற <b>/menu</b> தட்டச்சு செய்யுங்கள்.'))},350)}
  const mm=t.replace(/^[^\w/]+\s*/,'').match(/^\/([a-z_]+)(?:@\w+)?\s*(.*)$/i);
  if(!mm)return botSay({h:C(L('🤔 I only understand buttons and /commands','🤔 எனக்கு பொத்தான்களும் /கட்டளைகளும் மட்டுமே புரியும்'),[],L('Try <b>/menu</b> or <b>/help</b>.','<b>/menu</b> அல்லது <b>/help</b> முயலுங்கள்.'))},450);
  const name=mm[1].toLowerCase(),arg=mm[2].trim().toLowerCase();
  if(!Object.hasOwn(H,name))return botSay({h:C(L('❓ Unknown command <code>/'+esc(name)+'</code>','❓ தெரியாத கட்டளை <code>/'+esc(name)+'</code>'),[],L('Type <b>/help</b>.','<b>/help</b> தட்டச்சு செய்யுங்கள்.'))},450);
  if(S.killed&&!['wake','menu','help','start','status','kill','quiz'].includes(name))return botSay({tone:'danger',h:C(L('😴 Bot is asleep after Kill','😴 Kill-க்குப் பிறகு பாட் தூக்கத்தில்'),[],L('Type <b>/wake</b> (practice) to start again.','மீண்டும் தொடங்க <b>/wake</b> (பயிற்சி) தட்டச்சு செய்யுங்கள்.'))},450);
  return H[name](arg);
}

const G={on:true,i:0,step:null,phase:'done',locked:false,seen:new Set()};
function guard(tok){
  if(!G.on||!G.step)return true;
  if(tok.startsWith('act:quiz')||tok.startsWith('act:badge'))return true;
  if(G.locked)return false;
  if(G.phase==='done'){nudge(L('Press the yellow button on the coach 👇','கோச்சின் மஞ்சள் பொத்தானை அழுத்துங்கள் 👇'));return false}
  if(G.step.expect&&G.step.expect.includes(tok)){G.locked=true;return true}
  nudge(G.step.wrong?LP(G.step.wrong):L('Tap the glowing button 👆','ஒளிரும் பொத்தானைத் தட்டுங்கள் 👆'));return false;
}
function nudge(msg){sfx('nudge');const c=$('#coach');if(c){c.classList.remove('shake','enter');void c.offsetWidth;c.classList.add('shake')}toast(msg)}
function press(text){const tok=tokenOf(text);if(!guard(tok))return;userSay(text);enqueue(()=>route(text)).then(()=>afterAction(tok))}
function onAction(tok){G.seen.add(tok);afterAction(tok)}
function afterAction(tok){
  if(G.on){if(G.step&&G.phase==='do'&&G.step.expect&&G.step.expect.includes(tok))completeStep();return}
  freeExplain(tok);
}
chat.addEventListener('click',e=>{
  const b=e.target.closest('.inline button');if(!b||b.disabled)return;
  if(b.dataset.c){const c=b.dataset.c,tok=tokenOf(c);if(!guard(tok))return;userSay(c);enqueue(()=>route(c)).then(()=>afterAction(tok))}
  else if(b.dataset.a){const name=b.dataset.a,tok='act:'+name;if(!guard(tok))return;
    if(!b.dataset.keep)$$('button',b.closest('.inline')).forEach(x=>x.disabled=true);
    enqueue(async()=>{const r=await ACT[name](b);if(r)await botSay(r.m||resultMsg(r),r.m?300:450)}).then(()=>afterAction(tok))}
});

const spot=$('#spot'),finger=$('#finger'),screen=$('#screen');
let spotFn=null,spotRaf=0;
function setSpot(fn){spotFn=fn||null;cancelAnimationFrame(spotRaf);if(!spotFn){spot.style.display='none';finger.style.display='none';return}
  let scrolled=null;const loop=()=>{const el=spotFn&&spotFn();
    if(el){const r=el.getBoundingClientRect(),s=screen.getBoundingClientRect(),cr=chat.getBoundingClientRect();
      if(chat.contains(el)&&(r.bottom>cr.bottom||r.top<cr.top)&&scrolled!==el){scrolled=el;el.scrollIntoView({block:'nearest'})}
      const p=4;spot.style.display='block';spot.style.left=(r.left-s.left-p)+'px';spot.style.top=(r.top-s.top-p)+'px';spot.style.width=(r.width+p*2)+'px';spot.style.height=(r.height+p*2)+'px';
      finger.style.display='block';finger.style.left=(r.left-s.left+r.width/2-8)+'px';finger.style.top=(r.top-s.top+r.height-6)+'px'}
    else{spot.style.display='none';finger.style.display='none'}
    spotRaf=requestAnimationFrame(loop)};loop()}

const TOTAL=STEPS.length-1;
const visited=new Set();
function renderChapters(){
  const cur=G.step?G.step.ch:0;
  const ul=G.on?CHAPTERS.map((c,i)=>{const cls=i<cur?'done':i===cur?'now':'';return `<li class="${cls}"><i>${i<cur?'✓':i+1}</i>${LP(c)}</li>`}).join(''):Object.entries(ROOMS).map(([k,r])=>`<li class="${visited.has(k)?'done':''}"><i>${visited.has(k)?'✓':'·'}</i>${r.label}</li>`).join('');
  $('#chap').innerHTML=`<h4>${G.on?L('Your day','உங்கள் நாள்'):L('Rooms visited','பார்த்த அறைகள்')+' '+visited.size+'/6'}</h4><ul>${ul}</ul>`;
}
function renderCoach(){
  if(!G.on)return;const s=G.step,tag=`${L('Chapter','அத்தியாயம்')} ${s.ch+1} · ${LP(CHAPTERS[s.ch])}`;
  if(s.welcome){
    return showCoach({tag,title:LP(s.t),text:LP(s.x),actions:[{t:'English',alt:lang!=='en',fn:()=>setLang('en')},{t:'தமிழ்',alt:lang!=='ta',fn:()=>setLang('ta')},{t:soundOn?'🔊':'🔇',alt:true,fn:()=>{toggleSound();renderCoach()}},{t:L('▶ Start my day','▶ என் நாளைத் தொடங்கு'),fn:()=>{sfx('ok');advance()}}]});
  }
  if(G.phase==='do')return showCoach({tag,title:LP(s.t),text:LP(s.x)});
  const acts=s.final?[{t:L('🎮 Free Play','🎮 Free Play'),fn:()=>setMode('free')},{t:L('↺ Replay','↺ மீண்டும்'),alt:true,fn:()=>setMode('guided',true)},{t:L('📲 Install app','📲 செயலி நிறுவு'),alt:true,fn:doInstall}]:nextA(s.nextLabel&&LP(s.nextLabel));
  showCoach({tag,title:LP(s.dt||s.t),text:LP(s.dx||s.x),actions:acts});
}
function updateProgress(){$('#progBar').style.width=G.on?(G.i/TOTAL*100)+'%':'0'}
async function enterStep(i){
  const s=STEPS[i];G.i=i;G.step=s;G.locked=false;G.phase=s.expect?'do':'done';
  if(s.time!=null)setClock(s.time);
  updateProgress();renderChapters();
  if(s.enter)await s.enter();
  if(!G.on||G.step!==s)return;
  if(s.expect){const early=s.expect.find(e=>e.startsWith('stairs:')&&G.seen.has(e));if(early)return completeStep()}
  renderCoach();setSpot(s.spot);
}
function completeStep(){const s=G.step;G.phase='done';G.locked=false;setSpot(null);
  if(s.auto||(!s.dx&&!s.dt))return advance();
  renderCoach()}
function advance(){if(G.i<TOTAL)enterStep(G.i+1)}

 strikes:['At 9:28 the robot records the “anchor” price and picks the contract.','9:28-க்கு ரோபோ “ஆங்கர்” விலையைப் பதிவு செய்து ஒப்பந்தத்தைத் தேர்ந்தெடுக்கும்.'],
 gates:['Time gates say whether the robot is allowed to look for a trade right now.','இப்போது ரோபோ வர்த்தகம் தேட அனுமதியா என்று நேர கேட்கள் சொல்லும்.'],
 scan_start:['Turns on the live price scanner.','நேரலை விலை ஸ்கேனரை இயக்கும்.'],
 scan_stop:['Lets the scanner rest. Open trades stay protected.','ஸ்கேனருக்கு ஓய்வு. திறந்த வர்த்தகங்கள் பாதுகாப்பாகவே இருக்கும்.'],
 rms:['Your guardian shield: daily ₹5,000 loss budget and the circuit breaker.','உங்கள் பாதுகாப்புக் கவசம்: தினசரி ₹5,000 நஷ்ட வரம்பு மற்றும் பிரேக்கர்.'],
 ratchet:['Play with the profit stairs: the safety net only climbs, never slides down.','லாபப் படிகளுடன் விளையாடுங்கள்: பாதுகாப்பு வலை ஏறும்; இறங்காது.'],
 budget:['How much of today’s ₹5,000 loss budget is left.','இன்றைய ₹5,000 நஷ்ட வரம்பில் எவ்வளவு மீதம்.'],
 drawdown:['How far you have dipped from today’s best point.','இன்றைய உச்சத்திலிருந்து எவ்வளவு இறங்கினீர்கள்.'],
 reset_rms:['Admin tool to clear a tripped breaker.','பிரேக்கரை விடுவிக்கும் நிர்வாகி கருவி.'],
 ledger:['Your money diary of today’s completed trades.','இன்றைய முடிந்த வர்த்தகங்களின் பண நாட்குறிப்பு.'],
 charges:['Brokerage, STT, GST and SEBI fees — audited to the paise.','தரகு, STT, GST, SEBI கட்டணங்கள் — பைசா வரை தணிக்கை.'],
 capital:['The 50/50 partner profit split.','50/50 பங்காளர் லாபப் பிரிவு.'],
 eod:['The end-of-day report card: watch the wallet count up to ₹25,075.','நாள் முடிவு அறிக்கை: பணப்பை ₹25,075-க்கு ஏறுவதைப் பாருங்கள்.'],
 csv:['Exports your diary as a spreadsheet.','நாட்குறிப்பை ஸ்ப்ரெட்ஷீட்டாக ஏற்றுமதி செய்யும்.'],
 precheck:['The 7-gate health exam. If any gate fails, real-money trading is refused.','7-கேட் சுகாதாரப் பரிசோதனை. ஒரு கேட் தோல்வியடைந்தால் உண்மைப் பண வர்த்தகம் மறுக்கப்படும்.'],
 system:['Cloud computer health: CPU, memory, disk.','கிளவுட் கணினி நிலை: CPU, நினைவகம், டிஸ்க்.'],
 latency:['How quickly prices reach the robot.','விலைகள் ரோபோவை எவ்வளவு வேகமாக எட்டுகின்றன.'],
 logs:['The last lines of what the robot did.','ரோபோ செய்த கடைசி செயல்பாடுகள்.'],
 restart:['Restarts the service (admin).','சேவையை மறுதொடக்கும் (நிர்வாகி).'],
 status:['A quick health summary of the bot.','பாட்டின் விரைவு நிலை சுருக்கம்.'],
 positions:['Shows the open trade and whether the safety net is in place.','திறந்த வர்த்தகமும் பாதுகாப்பு வலை உள்ளதா என்பதும்.'],
 whatif:['Pick a worry and see how the bot protects you.','ஒரு கவலையைத் தேர்ந்து பாட் எப்படிப் பாதுகாக்கிறது என்று பாருங்கள்.'],
 quiz:['5 questions — earn the Certified Safe Bot Trader badge.','5 கேள்விகள் — Certified Safe Bot Trader பேட்ஜ் பெறுங்கள்.'],
 wake:['Practice only: wakes the bot after a Kill.','பயிற்சி மட்டும்: Kill-க்குப் பிறகு பாட்டை எழுப்பும்.'],
 menu:['Brings the keyboard back.','விசைப்பலகையைத் திரும்பக் கொண்டுவரும்.']
};
function freeCoachDefault(){showCoach({tag:L('Free Play','சுயமாக முயல்'),title:L('Tap anything!','எதையும் தட்டுங்கள்!'),text:L('Open a room, tap its commands or type one (try /whatif, /ratchet, /quiz). I’ll explain whatever you tap.','ஒரு அறையைத் திறந்து கட்டளைகளைத் தட்டுங்கள் அல்லது தட்டச்சு செய்யுங்கள் (/whatif, /ratchet, /quiz). நீங்கள் தட்டுவதை நான் விளக்குவேன்.'),min:true,actions:[{t:L('🎲 What if…?','🎲 என்ன நடக்கும்…?'),alt:true,fn:()=>press('/whatif')},{t:L('🎓 Quiz','🎓 வினாடி வினா'),alt:true,fn:()=>press('/quiz')}]})}
function freeExplain(tok){
  if(tok.startsWith('room:')){const k=tok.slice(5);visited.add(k);renderChapters();const r=ROOMS[k];return showCoach({tag:L('Room','அறை'),title:r.label,text:LP(r.sub)+'.',extra:L('Rooms visited: ','பார்த்த அறைகள்: ')+visited.size+'/6'})}
  const key=tok.startsWith('/')?tok.slice(1).split(' ')[0]:null;
  if(key&&Object.hasOwn(EX,key))showCoach({tag:L('What this means','இதன் பொருள்'),title:'/'+key,text:LP(EX[key]),extra:L('Rooms visited: ','பார்த்த அறைகள்: ')+visited.size+'/6'});
}

/* ================= mode, language, menu ================= */
function setLang(l){lang=l;store.set('lsp2_lang',l);applyI18n();renderChapters();if(G.on)renderCoach();else freeCoachDefault();$('#msg').placeholder=L('Message (try /kill)','செய்தி (/kill முயலுங்கள்)')}
function toggleSound(){soundOn=!soundOn;store.set('lsp2_sound',soundOn);if(soundOn)sfx('ok');toast(soundOn?L('🔊 Sound on','🔊 ஒலி ON'):L('🔇 Sound off','🔇 ஒலி OFF'))}
function resetAll(){S=fresh();chat.innerHTML='';kbState='main';kbHidden=false;renderKb();G.seen.clear();G.locked=false;qz={i:0,score:0};setSpot(null);q=Promise.resolve()}
const welcomeMsg=()=>({tone:'ok',h:C(L('👋 Welcome to LSP Trading Bot','👋 LSP Trading Bot-க்கு வரவேற்கிறோம்'),[],L('This is a <b>practice</b> bot — nothing here is real.','இது ஒரு <b>பயிற்சி</b> பாட் — இங்கே எதுவும் உண்மையல்ல.'))});
function setMode(m,restart){
  const guided=m==='guided';closeSheet();
  if(guided&&G.on&&!restart)return;
  $('#app').classList.toggle('guided',guided);
  $('#tabGuide').setAttribute('aria-selected',guided);$('#tabFree').setAttribute('aria-selected',!guided);
  if(guided){G.on=true;resetAll();say(welcomeMsg(),400);enterStep(0)}
  else{G.on=false;G.step=null;setSpot(null);updateProgress();setClock(540);renderChapters();freeCoachDefault();
    say({tone:'ok',h:C(L('🎮 Free Play','🎮 சுயமாக முயல்'),[],L('Tap any room or type a command. Nothing here is real.','எந்த அறையையும் தட்டுங்கள் அல்லது கட்டளை தட்டச்சு செய்யுங்கள். இங்கே எதுவும் உண்மையல்ல.'))},300)}
}
$('#tabGuide').addEventListener('click',()=>{if(!G.on)setMode('guided',true)});
$('#tabFree').addEventListener('click',()=>{if(G.on)setMode('free')});

const ov=$('#ov'),sheet=$('#sheet');
function closeSheet(){ov.classList.remove('open')}
ov.addEventListener('click',e=>{if(e.target===ov)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function openMenu(){
  sheet.innerHTML=`<h3>${L('Settings','அமைப்புகள்')}</h3>
   <div class="mrow"><span>🌐 ${L('Language','மொழி')}</span><span class="opts"><button data-m="en" class="${lang==='en'?'on':''}">English</button><button data-m="ta" class="${lang==='ta'?'on':''}">தமிழ்</button></span></div>
   <div class="mrow"><span>🔊 ${L('Sound','ஒலி')}</span><span class="opts"><button data-m="son" class="${soundOn?'on':''}">${L('On','ON')}</button><button data-m="soff" class="${!soundOn?'on':''}">${L('Off','OFF')}</button></span></div>
   <div class="mrow"><span>⏱️ ${L('Animation speed','வேகம்')}</span><span class="opts">${['slow','normal','fast'].map(s=>`<button data-m="sp_${s}" class="${speed===s?'on':''}">${{slow:L('Slow','மெதுவாக'),normal:L('Normal','சாதாரணம்'),fast:L('Fast','வேகமாக')}[s]}</button>`).join('')}</span></div>
   <button class="mbtn" data-m="restart">↺ ${L('Restart the guided day','வழிகாட்டி நாளை மீண்டும் தொடங்கு')}</button>
   <button class="mbtn" data-m="quiz">🎓 ${L('Take the quiz','வினாடி வினா எழுது')}</button>
   <a class="mbtn" href="LSP_Trading_Telegram_Bot_User_Guide.pdf" download>📥 ${L('Download the PDF guide','PDF வழிகாட்டியைப் பதிவிறக்கு')}</a>
   <button class="mbtn primary" data-m="install">📲 ${L('Install as an app','செயலியாக நிறுவு')}</button>
   <p class="mnote">${L('Practice simulator only. It never connects to a broker or places orders; all figures are samples. Trading carries a risk of loss; this is not investment advice.','இது பயிற்சி சிமுலேட்டர் மட்டுமே. எந்த பிரோக்கருடனும் இணையாது, ஆர்டர்கள் போடாது; எல்லா எண்களும் மாதிரி. வர்த்தகத்தில் இழப்பு ஆபத்து உண்டு; இது முதலீட்டு ஆலோசனை அல்ல.')}</p>`;
  ov.classList.add('open');
}
$('#menuBtn').addEventListener('click',openMenu);
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
  if(m==='en'||m==='ta'){setLang(m);openMenu()}
  else if(m==='son'||m==='soff'){soundOn=m==='son';store.set('lsp2_sound',soundOn);if(soundOn)sfx('ok');openMenu()}
  else if(m.startsWith('sp_')){speed=m.slice(3);store.set('lsp2_speed',speed);openMenu()}
  else if(m==='restart')setMode('guided',true);
  else if(m==='quiz'){setMode('free');enqueue(()=>quizBegin())}
  else if(m==='install'){closeSheet();doInstall()}
});

/* ================= install (PWA) ================= */
let deferredInstall=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
addEventListener('appinstalled',()=>{deferredInstall=null;toast(L('✅ App installed!','✅ செயலி நிறுவப்பட்டது!'))});
async function doInstall(){
  if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;return}
  const steps=isIOS?L('<ol style="margin-left:20px"><li>Tap the <b>Share</b> button ⬆️ in Safari.</li><li>Tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>','<ol style="margin-left:20px"><li>Safari-யில் <b>Share</b> ⬆️ தட்டுங்கள்.</li><li><b>Add to Home Screen</b> தட்டுங்கள்.</li><li><b>Add</b> தட்டுங்கள்.</li></ol>')
   :L('<ol style="margin-left:20px"><li>Open the browser menu <b>⋮</b>.</li><li>Tap <b>Install app</b> / <b>Add to Home screen</b>.</li></ol>','<ol style="margin-left:20px"><li>உலாவி மெனு <b>⋮</b> திறக்கவும்.</li><li><b>Install app</b> / <b>Add to Home screen</b> தட்டுங்கள்.</li></ol>');
  sheet.innerHTML=`<h3>📲 ${L('Install LSP Bot Academy','LSP Bot Academy நிறுவு')}</h3><p style="margin-bottom:8px">${L('Works offline once installed.','நிறுவிய பின் இணையமின்றி இயங்கும்.')}</p>${steps}<button class="mbtn primary" data-m="close">${L('Got it','சரி')}</button>`;
  $('[data-m=close]',sheet).addEventListener('click',closeSheet);
  ov.classList.add('open');
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ================= boot ================= */
applyI18n();renderKb();$('#msg').placeholder=L('Message (try /kill)','செய்தி (/kill முயலுங்கள்)');
setClock(535);
say(welcomeMsg(),400);
enterStep(0);
})();
</script>
</body>
</html>
